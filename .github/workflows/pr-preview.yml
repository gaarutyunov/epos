name: pr-preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/**"
      - ".github/workflows/pr-preview.yml"
concurrency: preview-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - if: github.event.action != 'closed'
        # The preview is served from a subdirectory, so every asset URL has to
        # be rebased onto it — otherwise the preview loads the main
        # deployment's bundle and shows content that is not in this PR.
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}
        run: npm ci && npm run build
        working-directory: docs
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: docs/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
