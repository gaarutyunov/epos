name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  GO_VERSION: "1.26.5"
# Nothing in CI writes to the repository; reading the code is the whole job.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: godog integration suite
        run: go test -tags=integration -timeout=30m ./tests/integration/...
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit
          path: "**/junit.xml"
          if-no-files-found: ignore

  # SPEC.md 13.2: the OCI distribution-spec conformance suite, Pull category,
  # run against epos-registry fronting real zot.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: start the upstream registry
        run: |
          docker run -d --name zot -p 5000:5000 \
            ghcr.io/project-zot/zot-linux-amd64:v2.1.18
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "zot did not become ready"; docker logs zot; exit 1

      # epos-registry serves no write path in A1 (4.5 is a later milestone), so
      # the suite cannot push its own fixtures through it. It supports exactly
      # this case: given a tag and the digests, it pulls content that already
      # exists. Seed that content straight into zot.
      - name: seed the fixture into the upstream
        run: go run ./tests/conformance/seed 127.0.0.1:5000 demo/hello:1.0.0 >> "$GITHUB_ENV"

      - name: start epos-registry in front of it
        run: |
          go build -o epos-registry ./cmd/epos-registry
          ./epos-registry --addr 127.0.0.1:5001 \
            --upstream http://127.0.0.1:5000 \
            --metrics.exporter none &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5001/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "epos-registry did not become ready"; exit 1

      - name: check out the conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opencontainers/distribution-spec
          ref: a139cc423184af6078077b9b7ee336eddbd03f8f # v1.1.1
          path: distribution-spec
          # Never leave this workflow's token in a third-party checkout.
          persist-credentials: false

      - name: OCI Pull conformance
        working-directory: distribution-spec/conformance
        env:
          OCI_ROOT_URL: http://127.0.0.1:5001
          OCI_NAMESPACE: demo/hello
          OCI_TEST_PULL: "1"
          OCI_HIDE_SKIPPED_WORKFLOWS: "1"
        run: go test -c -o conformance.test . && ./conformance.test

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance
          path: |
            distribution-spec/conformance/junit.xml
            distribution-spec/conformance/report.html
          if-no-files-found: error

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
