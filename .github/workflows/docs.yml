name: docs
on:
  push:
    branches: [main]
    # The Go CI stack and the docs site are independent: a change to one must
    # not spend a run of the other.
    # The catalog is rendered by a Go binary, so a change to it never touches
    # docs/. Without these paths a Go-driven catalog change would never deploy
    # — the site would keep serving whatever the last docs commit produced, and
    # nothing would say so.
    paths:
      - "docs/**"
      - "demo/**"
      - "internal/catalog/**"
      - "internal/registry/**"
      - "cmd/epos-registry/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-catalog/action.yml"
permissions:
  contents: write
concurrency:
  group: docs
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: npm ci && npm run build
        working-directory: docs

      # After the Astro build, never before: `astro build` clears docs/dist.
      #
      # Into the docs' own output rather than a second publish with
      # destination_dir, so there is one force-push to gh-pages instead of two.
      # Two publishers would have to be serialised, and joining this workflow's
      # concurrency group as it stands (cancel-in-progress: true) would let a
      # docs push cancel an in-flight catalog deploy — a quieter failure than
      # the one it was meant to fix.
      - uses: ./.github/actions/build-catalog
        with:
          base-path: /catalog
          out: docs/dist/catalog

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dist
          publish_branch: gh-pages
          # The custom domain lives in a CNAME file on the *deploy* branch, not
          # in the source tree. Declaring it here means the file is rewritten by
          # every deploy, so the subdomain survives a gh-pages force-push or a
          # branch rebuild instead of silently reverting to *.github.io.
          cname: epos.garutyunov.com
          # NOT in the SPEC.md 14.2 snippet, and required. Without it this
          # action replaces gh-pages wholesale, deleting every
          # pr-preview/pr-<N>/ directory the preview workflow put there — so
          # every open PR's preview would 404 the moment anything merged. Same
          # bug, same fix as gaarutyunov/gopgql#24.
          keep_files: true
