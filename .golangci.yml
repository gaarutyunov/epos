# golangci-lint v2 configuration (v2.12.2 — see SPEC.md 13.6).
# The v2 schema differs from v1; `version` is required.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
