# The statistics stack, for local development and for a deployment to copy.
#
# Four services and one ordering rule that matters more than the rest. The rule
# is not "apply the DDL first": it is that epos's schema is applied in two
# stages with the collector between them, because the two stages want opposite
# things.
#
#   1. schema     the database, the catalog's table and the three principals.
#                 Before the collector, which needs a user to connect as.
#   2. collector  starts, and provisions otel_traces — its own table, which epos
#                 declares nowhere.
#   3. rollup     the materialized view over otel_traces. It cannot be created
#                 before the table it reads exists, and it must exist before the
#                 first download span, because a materialized view is an insert
#                 trigger that does not backfill.
#
# Nothing points a registry at the collector until `docker compose up` has
# settled. That is the whole safety margin, and deploy/clickhouse/02-rollup.sql
# carries the backfill for a deployment where it was missed.
#
# Every image is pinned. Nothing here holds a credential: both passwords come
# from the environment, and the registry has neither.

name: epos-stats

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Stage 1. Applies epos's own objects that read nothing, and exits.
  schema:
    image: clickhouse/clickhouse-server:25.3.3.42-alpine
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/01-schema.sql:/01-schema.sql:ro
    entrypoint: ["sh", "-c"]
    command: >
      clickhouse-client --host clickhouse --user default
      --password "$$CLICKHOUSE_PASSWORD" --multiquery < /01-schema.sql
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}

  collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    depends_on:
      schema:
        condition: service_completed_successfully
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      EPOS_COLLECTOR_PASSWORD: ${EPOS_COLLECTOR_PASSWORD:?set EPOS_COLLECTOR_PASSWORD}
    ports:
      - "4317:4317"
      - "4318:4318"

  # Stage 2. Waits for the collector's own table, then creates the rollup over
  # it. The wait is a poll rather than a depends_on because the collector being
  # *started* is not the collector having provisioned its schema, and the
  # difference between those two is a materialized view that fails to create.
  rollup:
    image: clickhouse/clickhouse-server:25.3.3.42-alpine
    depends_on:
      collector:
        condition: service_started
    volumes:
      - ./clickhouse/02-rollup.sql:/02-rollup.sql:ro
    entrypoint: ["sh", "-c"]
    command: >
      until clickhouse-client --host clickhouse --user default
      --password "$$CLICKHOUSE_PASSWORD"
      --query "EXISTS TABLE epos.otel_traces" | grep -qx 1;
      do echo "waiting for otel_traces"; sleep 2; done;
      clickhouse-client --host clickhouse --user default
      --password "$$CLICKHOUSE_PASSWORD" --multiquery < /02-rollup.sql
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}

# epos-registry is deliberately not a service here. It is pointed at the
# collector, once the stack has settled, with:
#
#   epos-registry --upstream <registry> \
#     --traces.exporter otlp --traces.endpoint 127.0.0.1:4318 --traces.insecure
#
# and, if it also serves the catalog, with
#
#   --catalog.enabled --catalog.stats-source clickhouse
#
# plus EPOS_REGISTRY_CATALOG_STATS_DSN carrying the *read-only* epos_catalog
# credential. There is no flag that takes that DSN, and the registry never gets
# a write one.
